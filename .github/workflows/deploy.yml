name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ratings are append-only
        if: github.event_name == 'pull_request'
        run: python scripts/check_append_only.py origin/${{ github.base_ref }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate data and build site
        run: python scripts/build.py
      - name: Show disagreements waiting for a tie-breaker
        run: cat out/adjudication_queue.csv
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
